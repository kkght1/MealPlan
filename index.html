<title>Family Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fridge-door week — stacked day cards, three meal rows each, tagged chips you hold and drag; saved meals tray docked above the tab bar. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#16232A; --muted:#5D6B70; --line:#D9E2DF;
  --fam:#1C6E62; --fam-soft:#DCEFEA;
  --baby:#B35F0E; --baby-soft:#FCE9D3;
  --both:#5546A6; --both-soft:#E6E2F7;
  --danger:#B3261E; --danger-soft:#FBE3E1;
  --shadow:0 10px 30px rgba(22,35,42,.18);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1518; --surface:#182126; --ink:#E5ECEB; --muted:#93A2A5; --line:#2A363B;
  --fam:#62C6B5; --fam-soft:#163833; --baby:#F2A75C; --baby-soft:#3A2814; --both:#AFA2F2; --both-soft:#28244A;
  --danger:#F28B82; --danger-soft:#3D1D1B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1518; --surface:#182126; --ink:#E5ECEB; --muted:#93A2A5; --line:#2A363B;
  --fam:#62C6B5; --fam-soft:#163833; --baby:#F2A75C; --baby-soft:#3A2814; --both:#AFA2F2; --both-soft:#28244A;
  --danger:#F28B82; --danger-soft:#3D1D1B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fam);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.weekrow{display:flex;align-items:center;gap:8px}
.weekrow h1{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;margin:0;flex:1;min-width:0;text-wrap:balance}
.weekrow h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem;flex:none}
.textbtn{height:40px;padding-inline:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem}
.filterrow{display:flex;gap:8px;margin-top:10px}
.seg{flex:1;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Plan */
main{padding-block:12px calc(var(--tab-h) + 150px + env(safe-area-inset-bottom,0px))}
.days{display:flex;flex-direction:column;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day.today{border-color:var(--fam);box-shadow:0 0 0 1px var(--fam)}
.day h2{margin:0;display:flex;align-items:baseline;gap:8px;padding:10px 14px 6px;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.day h2 .dd{font-family:var(--f-body);font-weight:500;font-size:.85rem;color:var(--muted)}
.pill{margin-left:auto;font-family:var(--f-body);font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fam);background:var(--fam-soft);padding:3px 8px;border-radius:99px}
.slot{display:grid;grid-template-columns:74px 1fr;gap:8px;padding:6px 10px 6px 14px;border-top:1px dashed var(--line);min-height:50px;align-items:start;transition:background .12s}
.slot.over{background:var(--fam-soft)}
.slabel{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0;align-items:center;padding-block:3px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:34px;padding:5px 10px;border-radius:10px;font-weight:600;font-size:.9rem;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;border:1px solid transparent;position:relative}
.chip .cn{overflow-wrap:anywhere;min-width:0}
.chip .ct{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;flex:none}
.chip .nt{font-size:.75rem;opacity:.7;flex:none}
.t-family{background:var(--fam-soft);color:var(--fam)}
.t-baby{background:var(--baby-soft);color:var(--baby)}
.t-both{background:var(--both-soft);color:var(--both)}
.chip.dragging-src{opacity:.3}
.chip.insert-before{box-shadow:-4px 0 0 0 var(--ink)}
.add{width:34px;height:34px;border-radius:10px;border:1.5px dashed var(--line);background:none;color:var(--muted);font-size:1.2rem;line-height:1}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;box-shadow:var(--shadow);transform-origin:center;opacity:.95}
.hint{color:var(--muted);font-size:.85rem;text-align:center;padding:4px 8px 0}

/* Tray */
#tray{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
#tray .wrap{padding-block:8px 10px}
.trayhead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:2px 0;text-align:left}
.trayhead b{font-family:var(--f-display);font-weight:800;font-size:1rem}
.trayhead span{color:var(--muted);font-size:.8rem;flex:1}
.trayhead i{font-style:normal;color:var(--muted);transition:transform .2s}
#tray.closed .trayhead i{transform:rotate(180deg)}
#tray.closed .traybody{display:none}
.traybody{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.trayscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.trayscroll::-webkit-scrollbar{display:none}
.trayscroll .chip{flex:none;white-space:nowrap}
input.search,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:16px}
.field textarea{min-height:84px;resize:vertical}

/* Trash */
#trash{position:fixed;left:0;right:0;top:0;z-index:90;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 18px;background:var(--danger-soft);color:var(--danger);text-align:center;font-weight:700;border-bottom:2px dashed var(--danger);transform:translateY(-110%);transition:transform .15s}
#trash.show{transform:none}
#trash.over{background:var(--danger);color:var(--surface)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex;height:var(--tab-h)}
.tabs button{flex:1;border:0;background:none;font-weight:600;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--fam)}

/* Lists (meals, groceries) */
.panel{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center}
.row > input{flex:1;min-width:0}
.primary{border:0;background:var(--fam);color:var(--surface);font-weight:700;border-radius:12px;padding:11px 16px}
.ghostbtn{border:1px solid var(--line);background:var(--surface);font-weight:600;border-radius:12px;padding:10px 14px}
.danger{border:1px solid var(--danger);background:none;color:var(--danger);font-weight:700;border-radius:12px;padding:10px 14px}
.group h3{margin:0 0 6px;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:48px}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0;overflow-wrap:anywhere}
.li .sub{display:block;font-size:.78rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.t-family{background:var(--fam)}.dot.t-baby{background:var(--baby)}.dot.t-both{background:var(--both)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--surface);font-size:.85rem;font-weight:800}
.li.done .check{background:var(--fam);border-color:var(--fam)}
.li.done .main{text-decoration:line-through;color:var(--muted)}
.count{font-variant-numeric:tabular-nums;font-size:.75rem;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:99px}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;width:32px;height:32px}
.empty{color:var(--muted);text-align:center;padding:22px 16px;font-size:.92rem;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.note{font-size:.78rem;color:var(--muted);text-align:center}

/* Sheet */
#sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(10,18,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#trash{transition:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0 0 12px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tagseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tagseg button{border:1.5px solid var(--line);background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tagseg button[aria-pressed="true"].t-family{border-color:var(--fam);background:var(--fam-soft);color:var(--fam)}
.tagseg button[aria-pressed="true"].t-baby{border-color:var(--baby);background:var(--baby-soft);color:var(--baby)}
.tagseg button[aria-pressed="true"].t-both{border-color:var(--both);background:var(--both-soft);color:var(--both)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg .chip{cursor:pointer;border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb{display:flex;gap:10px;align-items:center;font-size:.92rem}
.cb input{width:20px;height:20px;accent-color:var(--fam)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .primary{flex:1}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:8px}
.step p{margin:0;font-size:.9rem;color:var(--muted)}
.step .lbl{color:var(--ink)}
details.fmt{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details.fmt summary{padding:9px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
details.fmt pre{margin:0;padding:0 12px 12px;white-space:pre-wrap;font:.8rem/1.45 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink);user-select:text;-webkit-user-select:text}
#fImport{min-height:170px;font-size:14px}
.preview{border-radius:10px;padding:10px 12px;font-size:.88rem;background:var(--fam-soft);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.preview.bad{background:var(--danger-soft);color:var(--danger)}
.preview b{font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:95;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Hub additions: ideas card, rotation stars, kitchen status, baby stash, planner */
:root{--star:#D08A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--star:#F5C04A}}
:root[data-theme="dark"]{--star:#F5C04A}
.ideas{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px}
.ideas b{font-family:var(--f-display);font-weight:800;font-size:1rem}
.ideas span{color:var(--muted);font-size:.88rem;white-space:pre-line;overflow-wrap:anywhere}
.ideas.has{border-style:solid;border-color:var(--both);background:var(--both-soft)}
.ideas.has span{color:var(--ink)}
.gmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column}
.star{border:0;background:none;font-size:1.25rem;line-height:1;color:var(--line);width:32px;height:32px;flex:none}
.star[aria-pressed="true"]{color:var(--star)}
.chip .fv{color:var(--star);font-size:.8rem;flex:none}
.stat{border:0;border-radius:99px;padding:5px 10px;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;flex:none;min-width:52px}
.s-have{background:var(--fam-soft);color:var(--fam)}
.s-low{background:var(--baby-soft);color:var(--baby)}
.s-out{background:var(--danger-soft);color:var(--danger)}
.sel{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 8px;font-size:16px;flex:none}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-weight:700;font-size:.8rem;flex:none}
.mini.on{background:var(--baby-soft);color:var(--baby);border-color:transparent}
.ctr{display:flex;align-items:center;gap:4px;flex:none}
.ctr button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:800}
.ctr b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.warn{color:var(--baby);font-weight:700}
.ghd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ghd h3{margin:0;flex:1}
.ghd .mini{padding:4px 9px}
details.onhand{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.onhand summary{padding:12px 14px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
details.onhand .list{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.textbtn.ai{background:var(--both);color:var(--surface);border-color:var(--both)}
.pday{margin:6px 0 2px;font-weight:800;font-size:.9rem}
.pm{display:flex;gap:8px;font-size:.88rem;padding:2px 0}
.pm .s{width:62px;color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;flex:none}
.pm .n{flex:1;min-width:0;overflow-wrap:anywhere}
.pm .n small{display:block;color:var(--muted);font-size:.78rem}
.badge{font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:2px}
.summary{background:var(--both-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.busy{display:flex;align-items:center;gap:12px;padding:18px 4px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--both);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.copybox{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font:.82rem/1.45 ui-monospace,"SF Mono",Menlo,monospace}
.tabs button{font-size:.72rem}
.chip .ck{font-weight:800;flex:none}
.field .li select.sel{width:auto;flex:none;padding:7px 8px;font-size:15px}
.chip.cooked{opacity:.75}
.field > label.cb{text-transform:none;letter-spacing:0;font-size:.92rem;font-weight:500;color:var(--ink);align-items:flex-start}
.field > label.cb input{margin-top:1px;flex:none}
</style>

<div class="top"><div class="wrap">
  <div class="weekrow">
    <button class="iconbtn" id="prevWeek" aria-label="Previous week">‹</button>
    <h1 id="weekTitle">This week<small>&nbsp;</small></h1>
    <button class="textbtn" id="thisWeek" hidden>Today</button>
    <button class="iconbtn" id="nextWeek" aria-label="Next week">›</button>
  </div>
  <div class="filterrow" id="filterRow">
    <div class="seg" id="filter" role="group" aria-label="Show meals for">
      <button data-f="all" aria-pressed="true">Everyone</button>
      <button data-f="family" aria-pressed="false">Family</button>
      <button data-f="baby" aria-pressed="false">Baby</button>
    </div>
    <button class="textbtn" id="openImport">Import</button>
    <button class="textbtn ai" id="openPlanner" hidden>✦ Plan</button>
  </div>
</div></div>

<main id="vPlan"><div class="wrap"><div class="days" id="days"></div>
  <p class="hint">Tap + to add a meal. Hold a meal for a moment, then drag it to move it.</p>
</div></main>
<main id="vMeals" hidden><div class="wrap panel" id="mealsPanel"></div></main>
<main id="vGroc" hidden><div class="wrap panel" id="grocPanel"></div></main>
<main id="vKitchen" hidden><div class="wrap panel" id="kitPanel"></div></main>
<main id="vBaby" hidden><div class="wrap panel" id="babyPanel"></div></main>

<div id="tray"><div class="wrap">
  <button class="trayhead" id="trayToggle" aria-expanded="true"><b>Saved meals</b><span>Hold one and drag it onto a day</span><i>▾</i></button>
  <div class="traybody">
    <div class="trayscroll" id="trayList"></div>
  </div>
</div></div>

<div id="trash">Drop here to remove</div>

<nav class="tabs"><div class="wrap" role="tablist">
  <button role="tab" data-tab="plan" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Plan</button>
  <button role="tab" data-tab="groc" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.6"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Groceries</button>
  <button role="tab" data-tab="kitchen" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 10h14M9 6v1.5M9 13v2.5"/></svg>Kitchen</button>
  <button role="tab" data-tab="baby" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 6l2.5-1.5M9.5 19.5 12 18l2.5 1.5"/></svg>Baby prep</button>
  <button role="tab" data-tab="meals" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 13h16a8 8 0 0 1-16 0zM12 9V4M8.5 9.5 7 6M15.5 9.5 17 6"/></svg>Meals</button>
</div></nav>

<div id="sheetwrap" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toast" role="status"></div>

<script>
(() => {
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SLOTS = [['b','Breakfast'],['l','Lunch'],['d','Dinner']];
const TAGS = [['family','Family'],['baby','Baby'],['both','Both']];
const TAGNAME = {family:'Family',baby:'Baby',both:'Both'};
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const norm = s => String(s || '').trim().toLowerCase();

/* ---------- dates ---------- */

/* ---------- persistence: shared household docs (hub/*), local cache as backup ----------
   Earlier versions kept each person's data in private docs; those are copied over on first load. */
let db = null, uid = null, sampleFn = null;
const loaded = {}, dirty = {}, timers = {}, writing = {}, again = {};
const docRef = k => db.collection('hub').doc(k);
const oldRef = k => db.collection('data/users/' + uid).doc(k);
const weekDocKey = k => 'week-' + k;
function cacheLocal() { try { localStorage.setItem(LS, JSON.stringify({ library: S.library, kitchen: S.kitchen, baby: S.baby, weeks: S.weeks, view: S.view })); } catch {} }
function save(k) {
  cacheLocal();
  dirty[k] = true;
  if (!db || !loaded[k]) return;
  clearTimeout(timers[k]);
  timers[k] = setTimeout(() => flush(k), 500);
}
const saveLib = () => save('library');
const saveKit = () => save('kitchen');
const saveBaby = () => save('baby');
const saveWeek = (wk = S.view.week) => { stampLast(wk); save(weekDocKey(wk)); };
// remember the latest week each saved meal was planned, so rotation can favour ones not had lately
function stampLast(wk) {
  let changed = false;
  (S.weeks[wk]?.entries || []).forEach(e => { const m = findLib(e.name); if (m && (!m.last || m.last < wk)) { m.last = wk; changed = true; } });
  if (changed) saveLib();
}
function docData(k) { return k === 'library' ? S.library : k === 'kitchen' ? S.kitchen : k === 'baby' ? S.baby : week(k.slice(5)); }
async function flush(k, retried) {
  if (writing[k]) { again[k] = true; return; }
  writing[k] = true;
  try { await docRef(k).set(JSON.parse(JSON.stringify(docData(k)))); dirty[k] = false; }
  catch (e) {
    if (e && e.code === 'unavailable' && !retried) { writing[k] = false; setTimeout(() => flush(k, true), 800 + Math.random() * 800); return; }
    if (e && e.code === 'quota_exceeded') toast('Storage is full. Delete old weeks or meals.');
    else if (e && (e.code === 'permission_denied' || e.code === 'not_granted')) toast('You can view this plan but not change it.');
    else toast('Couldn’t save to your account. Saved on this device.');
  }
  writing[k] = false;
  if (again[k]) { again[k] = false; flush(k); }
}
const loadP = {};
function loadDoc(k) {
  if (!db) return Promise.resolve();
  return (loadP[k] ||= loadDocOnce(k));
}
async function loadDocOnce(k) {
  loaded[k] = false;
  try {
    let snap = await docRef(k).get(), fromOld = false;
    if (!snap.exists && uid && k === 'library') {
      try { const o = await oldRef(k).get(); if (o.exists) { snap = o; fromOld = true; } } catch {}
    }
    if (!snap.exists && k.startsWith('week-')) {
      const wk = k.slice(5), legacy = await legacyWeek(wk);
      if (legacy) {
        const cur = S.weeks[wk];
        if (dirty[k] && cur) cur.entries = [...legacy.entries, ...cur.entries]; else S.weeks[wk] = legacy;
        cacheLocal(); fromOld = true;
      }
    }
    if (snap.exists && !dirty[k]) {
      const d = JSON.parse(JSON.stringify(snap.data()));
      if (k === 'library') S.library = Object.assign({ meals: [], starter: true }, d);
      else if (k === 'kitchen') S.kitchen = Object.assign({ items: [], prefs: {} }, d);
      else if (k === 'baby') S.baby = Object.assign({ recipes: [], stash: [], starter: true }, d);
      else S.weeks[k.slice(5)] = Object.assign(newWeek(), d);
      cacheLocal();
    }
    loaded[k] = true;
    const wk = k.startsWith('week-') ? S.weeks[k.slice(5)] : null;
    const hasLocal = !k.startsWith('week-') || !!(wk && (wk.entries?.length || wk.extras?.length || wk.box?.length || wk.ideas || wk.prep?.length));
    if (fromOld || (!snap.exists && hasLocal) || dirty[k]) flush(k);
    render();
  } catch { delete loaded[k]; delete loadP[k]; }
}
// Earlier versions ran weeks Monday to Sunday (day 0 = Monday), keyed by the Monday, in hub/ or in
// private per-person docs. A Sunday week takes Mon–Sat from the Monday week starting the next day,
// and its Sunday from the Monday week that started six days before.
async function legacyWeek(wk) {
  const get = async key => {
    try { const a = await docRef(key).get(); if (a.exists) return JSON.parse(JSON.stringify(a.data())); } catch {}
    if (uid) { try { const b = await oldRef(key).get(); if (b.exists) return JSON.parse(JSON.stringify(b.data())); } catch {} }
    return null;
  };
  const sun = parseKey(wk);
  const [main, prev] = await Promise.all([get(weekDocKey(ymd(addDays(sun, 1)))), get(weekDocKey(ymd(addDays(sun, -6))))]);
  const prevSun = (prev?.entries || []).filter(e => e.day === 6);
  if (!main && !prevSun.length) return null;
  const w = Object.assign(newWeek(), main || {}, { entries: [] });
  prevSun.forEach(e => w.entries.push({ ...e, day: 0 }));
  (main?.entries || []).filter(e => e.day <= 5).forEach(e => w.entries.push({ ...e, day: e.day + 1 }));
  return w;
}
(async () => {
  const c = window.claude;

  try {
    const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
    if (!d) return;
    try { uid = u ? await u.id() : null; } catch {}
    db = d;
    await Promise.all(['library', 'kitchen', 'baby', weekDocKey(S.view.week)].map(loadDoc));
  } catch {}
})();

/* ---------- groceries ---------- */
// "Sweet Potatoes" and "sweet potato" are the same grocery item
const single = w => w.replace(/ies$/, 'y').replace(/(oes|ches|shes|xes)$/, m => m.slice(0, -2)).replace(/([^s])s$/, '$1');
const itemKey = s => norm(s).replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean).map(single).join(' ');
// "frozen chicken thighs" in the freezer covers "chicken thighs" in a recipe
const QUAL = /\b(fresh|frozen|organic|canned|dried|dry|bag|box|can|jar|tin|of|pc|large|small|whole|raw|plain|unsalted|low sodium|no salt added|boneless|skinless)\b/g;
const coreKey = s => itemKey(s).replace(QUAL, ' ').replace(/\s+/g, ' ').trim();
function kitchenMatch(text) { const c = coreKey(text); return c ? S.kitchen.items.find(i => coreKey(i.name) === c) || null : null; }
const prefFor = it => (it.kit && it.kit.pc) || S.kitchen.prefs[itemKey(it.text)] || '';
function groceryData(wk = S.view.week) {
  const w = week(wk), map = new Map();
  const add = (i, label) => {
    const k = itemKey(i); if (!k) return;
    if (!map.has(k)) map.set(k, { key: k, text: i.trim(), meals: [] });
    map.get(k).meals.push(label);
  };
  [...w.entries].sort((a, b) => a.day - b.day || 'bld'.indexOf(a.slot) - 'bld'.indexOf(b.slot))
    .forEach(e => (e.ing || []).forEach(i => add(i, `${DAYS[e.day].slice(0, 3)} ${e.name}`)));
  w.prep.forEach(id => { const r = S.baby.recipes.find(x => x.id === id); if (r) (r.ing || []).forEach(i => add(i, `Baby prep: ${r.name}`)); });
  const list = [], onHand = [];
  for (const it of map.values()) {
    it.kit = kitchenMatch(it.text);
    if (it.kit && it.kit.status !== 'have') it.low = it.kit.status;
    if (w.have[it.key] || (it.kit && it.kit.status === 'have' && !w.need[it.key])) onHand.push(it); else list.push(it);
  }
  const used = new Set([...list, ...onHand].map(it => it.kit).filter(Boolean));
  const restock = S.kitchen.items.filter(i => i.status !== 'have' && !used.has(i))
    .map(i => ({ key: 'k:' + i.id, text: i.name, kit: i, low: i.status, meals: [] }));
  return { list, onHand, restock };
}
function grocRow(it, w) {
  const done = !!w.checked[it.key], pref = prefFor(it);
  const sub = [it.low ? (it.low === 'out' ? 'Out in the kitchen' : 'Running low') : '', it.meals.slice(0, 3).join(' · ') + (it.meals.length > 3 ? ` +${it.meals.length - 3}` : ''), pref ? 'PC: ' + pref : ''].filter(Boolean).join(' · ');
  return `<div class="li${done ? ' done' : ''}"><button class="check" data-check="${esc(it.key)}" aria-label="Check off ${esc(it.text)}">${done ? '✓' : ''}</button>`
    + `<button class="gmain" data-check="${esc(it.key)}"><span class="main">${esc(it.text)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</span></button>`
    + (it.meals.length > 1 ? `<span class="count">×${it.meals.length}</span>` : '')
    + `<button class="x" data-gopt="${esc(it.key)}" aria-label="Options for ${esc(it.text)}">⋯</button></div>`;
}
function renderGroc() {
  const w = week(), g = groceryData();
  const byDone = (a, b) => !!w.checked[a.key] - !!w.checked[b.key] || a.text.localeCompare(b.text);
  const extras = [...w.extras].sort((a, b) => a.done - b.done);
  const all = [...g.list, ...g.restock];
  const left = all.filter(i => !w.checked[i.key]).length + extras.filter(x => !x.done).length;
  const checkedN = all.filter(i => w.checked[i.key]).length + extras.filter(x => x.done).length;
  let html = `<div class="row"><input class="search" id="extraInput" placeholder="Add an item, like diapers or coffee" aria-label="Add grocery item" enterkeyhint="done"><button class="primary" id="addExtra">Add</button></div>`;
  if (!all.length && !extras.length) {
    html += `<div class="empty">Nothing to buy yet. Ingredients from this week’s meals and baby prep show up here, along with anything marked low in the Kitchen.</div>`;
  } else {
    if (g.list.length) html += `<div class="group"><h3>For this week’s meals</h3><div class="list">${[...g.list].sort(byDone).map(it => grocRow(it, w)).join('')}</div></div>`;
    if (g.restock.length) html += `<div class="group"><h3>Restock · low or out in the kitchen</h3><div class="list">${[...g.restock].sort(byDone).map(it => grocRow(it, w)).join('')}</div></div>`;
    if (extras.length) html += `<div class="group"><h3>Extras</h3><div class="list">`
      + extras.map(x => `<div class="li${x.done ? ' done' : ''}"><button class="check" data-xcheck="${x.id}" aria-label="Check off ${esc(x.text)}">${x.done ? '✓' : ''}</button><span class="main">${esc(x.text)}</span><button class="x" data-xdel="${x.id}" aria-label="Remove ${esc(x.text)}">×</button></div>`).join('')
      + '</div></div>';
    html += `<div class="actions"><button class="primary" id="openPC">Send to PC Express (${left})</button><button class="ghostbtn" id="copyList">Copy list</button></div>`
      + `<div class="actions">${checkedN ? `<button class="ghostbtn" id="putAway">Put away ${checkedN} checked</button>` : ''}<button class="ghostbtn" id="uncheckAll">Uncheck all</button></div>`;
  }
  if (g.onHand.length) html += `<details class="onhand"><summary>Already have ${g.onHand.length} item${g.onHand.length > 1 ? 's' : ''} for this week’s meals</summary><div class="list">`
    + g.onHand.sort((a, b) => a.text.localeCompare(b.text)).map(it => `<div class="li"><span class="main">${esc(it.text)}<span class="sub">${it.kit ? `In the ${it.kit.loc}${it.kit.qty ? ' · ' + esc(it.kit.qty) : ''}` : 'You said you have it'}</span></span><button class="mini" data-needit="${esc(it.key)}">Buy anyway</button></div>`).join('')
    + '</div></details>';
  $('#grocPanel').innerHTML = html;
}

/* ---------- copy ---------- */
function copyText(text, ok) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let done = false; try { done = document.execCommand('copy'); } catch {}
    ta.remove(); toast(done ? ok : 'Couldn’t copy. Press and hold the text to copy it.');
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast(ok), fallback); else fallback();
}

/* ---------- import from Claude ---------- */
const CLAUDE_FORMAT = `When the two-week plan is final, write it out in exactly this format so I can paste it into my meal planner app. Plain text only, no tables.

WEEK 1
Sunday
Breakfast: Meal name [Both] | ingredient, ingredient
Lunch: Meal name [Family] | ingredient, ingredient
Lunch: Meal name [Baby] | ingredient, ingredient | short note
Dinner: Meal name [Both] | ingredient, ingredient
Monday
...continue through Saturday
WEEK 2
Sunday
...continue through Saturday

Rules:
- One line per meal, starting with Breakfast:, Lunch: or Dinner:
- Tag every meal [Family] for the two adults, [Baby] for our one-year-old, or [Both] when everyone eats it. When the baby eats something different, give the baby their own line for that meal.
- After the | list every ingredient the meal uses, as simple grocery names without amounts (“chicken thighs”, not “1.5 lb chicken thighs, diced”).
- An optional second | adds a short note, like a prep tip or a cooking time.`;

const DAYIDX = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
const DAYLINE = /^(monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues?|wed|thu(?:rs?)?|fri|sat|sun)\b(.*)$/i;
function tagFrom(s) {
  s = norm(s);
  if (/baby|toddler|kid|little|infant/.test(s)) return 'baby';
  if (/both|everyone|all|whole|shared/.test(s)) return 'both';
  if (/family|adult|grown|parent/.test(s)) return 'family';
  return '';
}
function parsePlan(text) {
  const weeks = [], skipped = [];
  let wi = -1, day = -1, lastDay = -1;
  const cur = () => { if (wi < 0) wi = 0; while (weeks.length <= wi) weeks.push({ entries: [], box: [] }); return weeks[wi]; };
  for (const raw of String(text || '').split(/\r?\n/)) {
    const line = raw.replace(/^[\s>#\-–•·*]+/, '').replace(/[*_`#]+/g, '').trim();
    if (!line) continue;
    let m;
    if ((m = line.match(/^week\s*(\d+)\b/i))) { wi = Math.max(0, +m[1] - 1); cur(); day = -1; lastDay = -1; continue; }
    if ((m = line.match(/^(?:farm\s*)?box\b[^:|]*:\s*(.*)$/i))) { cur().box.push(...parseIng(m[1])); continue; }
    if ((m = line.match(/^(breakfast|lunch|dinner|supper)\b\s*(?:\(([^)]*)\)|\[([^\]]*)\])?\s*[:\-–—]\s*(.+)$/i))) {
      if (day < 0) { skipped.push(line); continue; }
      const parts = m[4].split('|').map(x => x.trim());
      let name = parts[0], tag = tagFrom(m[2] || m[3] || '');
      const tm = name.match(/\s*[\[(]\s*(family|baby|both|everyone|all|adults?|kids?|toddler)\s*[\])]\s*/i);
      if (tm) { tag = tagFrom(tm[1]); name = name.replace(tm[0], ' '); }
      name = name.replace(/\s+/g, ' ').replace(/[\s:;,.\-–—]+$/, '').trim();
      if (!name) { skipped.push(line); continue; }
      const slot = { b: 'b', l: 'l', d: 'd', s: 'd' }[m[1][0].toLowerCase()];
      cur().entries.push({ day, slot, name, tag: tag || 'family', ing: parseIng((parts[1] || '').replace(/^ingredients?\s*:\s*/i, '')), note: parts.slice(2).join(' · ') });
      continue;
    }
    if ((m = line.match(DAYLINE)) && !m[2].includes('|') && m[2].length < 32) {
      const d = DAYIDX[m[1].slice(0, 3).toLowerCase()];
      if (wi < 0) wi = 0; else if (d <= lastDay) { wi++; }
      cur(); day = d; lastDay = d; continue;
    }
  }
  const used = weeks.map((w, i) => ({ ...w, index: i })).filter(w => w.entries.length || w.box.length);
  return { weeks: used, meals: used.reduce((n, w) => n + w.entries.length, 0), skipped };
}
function weekRange(k) {
  const a = parseKey(k), b = addDays(a, 6);
  return a.getMonth() === b.getMonth() ? `${MON[a.getMonth()]} ${a.getDate()} – ${b.getDate()}` : `${MON[a.getMonth()]} ${a.getDate()} – ${MON[b.getMonth()]} ${b.getDate()}`;
}
const targetKey = (start, i) => ymd(addDays(parseKey(start), 7 * i));
function drawImport() {
  const next = ymd(addDays(parseKey(THIS_WEEK), 7)), after = ymd(addDays(parseKey(THIS_WEEK), 14));
  const def = S.view.week !== THIS_WEEK ? S.view.week : (week(THIS_WEEK).entries.length ? next : THIS_WEEK);
  const opts = [[THIS_WEEK, 'This week'], [next, 'Next week'], [after, 'In two weeks']];
  if (!opts.some(o => o[0] === def)) opts.push([def, 'Week shown']);
  $('#sheet').innerHTML = `<div class="grab"></div><h2>Import a plan from Claude</h2><form class="form steps" id="sheetForm" autocomplete="off">
    <div class="step"><span class="lbl">1 · Ask Claude for the right format</span>
      <p>Add these instructions to your meal plan chat. Claude will write the plan in a format the app can read.</p>
      <button type="button" class="ghostbtn" id="copyPrompt">Copy instructions for Claude</button>
      <details class="fmt"><summary>Show the instructions</summary><pre>${esc(CLAUDE_FORMAT)}</pre></details></div>
    <div class="step"><label class="lbl" for="fImport">2 · Paste Claude’s plan</label>
      <textarea id="fImport" placeholder="WEEK 1&#10;Sunday&#10;Breakfast: Banana oat pancakes [Both] | bananas, oats, eggs&#10;…"></textarea></div>
    <div class="step"><label class="lbl" for="fStart">3 · Start on</label>
      <select id="fStart" class="search">${opts.map(([k, l]) => `<option value="${k}"${k === def ? ' selected' : ''}>${l} · ${weekRange(k)}</option>`).join('')}</select>
      <label class="cb"><input type="checkbox" id="fReplace" checked> Replace meals already planned in those weeks</label>
      <label class="cb"><input type="checkbox" id="fSaveAll" checked> Add new meals to Saved meals</label></div>
    <div class="preview" id="preview" hidden></div>
    <div class="actions"><button class="primary" type="submit" id="doImport" disabled>Import</button><button class="ghostbtn" type="button" id="fCancel">Cancel</button></div></form>`;
  drawPreview();
}
function drawPreview() {
  const box = $('#preview'), btn = $('#doImport'), txt = $('#fImport').value;
  if (!txt.trim()) { box.hidden = true; btn.disabled = true; return; }
  const p = parsePlan(txt), start = $('#fStart').value, replace = $('#fReplace').checked;
  box.hidden = false;
  if (!p.meals) {
    box.className = 'preview bad'; btn.disabled = true;
    box.innerHTML = 'No meals found. Each meal needs its own line starting with Breakfast:, Lunch: or Dinner:, under a day name like Sunday. Use the instructions in step 1 so Claude writes it that way.';
    return;
  }
  box.className = 'preview'; btn.disabled = false;
  box.innerHTML = p.weeks.map((w, i) => {
    const k = targetKey(start, i), existing = S.weeks[k]?.entries?.length || 0;
    const tags = { family: 0, baby: 0, both: 0 }; w.entries.forEach(e => tags[e.tag]++);
    return `<div>Week ${i + 1} → <b>${weekRange(k)}</b>: <b>${w.entries.length}</b> meals (${tags.family} family, ${tags.baby} baby, ${tags.both} both)${existing && replace ? `. Replaces ${existing} planned meal${existing > 1 ? 's' : ''}.` : ''}</div>`;
  }).join('') + (p.skipped.length ? `<div>${p.skipped.length} meal line${p.skipped.length > 1 ? 's' : ''} came before any day name and will be skipped.</div>` : '');
}
async function runImport() {
  const p = parsePlan($('#fImport').value); if (!p.meals) return;
  const start = $('#fStart').value, replace = $('#fReplace').checked, saveAll = $('#fSaveAll').checked;
  const keys = p.weeks.map((_, i) => targetKey(start, i));
  $('#doImport').disabled = true; $('#doImport').textContent = 'Importing…';
  try { await Promise.all(keys.map(k => loadDoc(weekDocKey(k)))); } catch {}
  p.weeks.forEach((pw, i) => {
    const w = week(keys[i]);
    if (replace) { w.entries = []; w.checked = {}; }
    pw.entries.forEach(e => w.entries.push({ id: uidGen(), ...e }));
    saveWeek(keys[i]);
  });
  if (saveAll) {
    let added = 0;
    p.weeks.forEach(pw => pw.entries.forEach(e => { if (!findLib(e.name)) { S.library.meals.push({ id: uidGen(), name: e.name, tag: e.tag, ing: [...e.ing] }); added++; } }));
    if (added) saveLib();
  }
  closeSheet();
  S.view.week = keys[0]; S.view.tab = 'plan'; cacheLocal(); window.scrollTo(0, 0); render();
  toast(`Imported ${p.meals} meals into ${keys.length > 1 ? `${weekRange(keys[0]).split(' – ')[0]} – ${weekRange(keys.at(-1)).split(' – ').pop()}` : weekRange(keys[0])}`);

// after cooking, ask what's left of the tracked kitchen items a recipe used
function usageFields(ing) {
  const seen = new Set(), items = [];
  (ing || []).forEach(i => { const k = kitchenMatch(i); if (k && k.status !== 'out' && !seen.has(k.id)) { seen.add(k.id); items.push(k); } });
  if (!items.length) return `<p class="note" style="text-align:left">None of the ingredients are tracked in the Kitchen, so there’s nothing to update.</p>`;
  return `<div class="field"><span class="lbl">What’s left in the kitchen?</span><div class="list">`
    + items.map(k => `<div class="li"><span class="main">${esc(k.name)}<span class="sub">${LOCS.find(l => l[0] === k.loc)[1]}${k.qty ? ' · ' + esc(k.qty) : ''}</span></span>`
      + `<select class="sel" data-use="${k.id}" aria-label="${esc(k.name)}">${[['have','Still have'],['low','Running low'],['out','Used up']].map(([v, l]) => `<option value="${v}"${v === k.status ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')
    + `</div><p class="note" style="text-align:left">Running low and Used up items go on the grocery list.</p></div>`;
}
function applyUsage() {
  let n = 0;
  document.querySelectorAll('[data-use]').forEach(sel => { const k = S.kitchen.items.find(x => x.id === sel.dataset.use); if (k && k.status !== sel.value) { k.status = sel.value; n++; } });
  if (n) saveKit();
  return n;
}

function extraSheetClick(t) {

    if (sheet.mode === 'kitem') { S.kitchen.items = S.kitchen.items.filter(x => x.id !== sheet.id); saveKit(); }
    if (sheet.mode === 'stash') { S.baby.stash = S.baby.stash.filter(x => x.id !== sheet.id); saveBaby(); }
    if (sheet.mode === 'brecipe') { S.baby.recipes = S.baby.recipes.filter(x => x.id !== sheet.id); saveBaby(); }
    closeSheet(); render(); toast('Deleted'); return true;
  }
  if (t.id === 'copyPcPrompt') { copyText(sheet.prompt, 'Copied. Paste it into Claude in Chrome.'); return true; }
  if (t.id === 'copyPlain') { copyText(sheet.list, 'List copied'); return true; }
  if (t.id === 'plStop') { sheet.ctl?.abort(); return true; }
  if (t.id === 'plAgain') { sheet.step = 'form'; drawPlanner(); return true; }
  if (t.id === 'plUse') { applyPlan(); return true; }
  return false;
}

function drawPlanner() {
  const s = sheet, w = week();
  s.opt ||= { ideas: w.ideas, slots: ['l', 'd'], fresh: 2, keep: true, baby: true };
  const o = s.opt;
  if (!s.step || s.step === 'form') {
    s.step = 'form';
    const kc = S.kitchen.items.filter(i => i.status !== 'out').length, favs = S.library.meals.filter(m => m.fav).length;
    sh(form(`Plan ${weekRange(S.view.week)} with Claude`,
      fieldTa('plIdeas', 'Ideas and cravings', o.ideas, 'e.g. Use up the frozen shrimp, something cozy for Sunday, try a new lentil dish')
      + `<div class="field"><span class="lbl">Fill in</span>${SLOTS.map(([k, l]) => `<label class="cb"><input type="checkbox" data-plslot="${k}"${o.slots.includes(k) ? ' checked' : ''}> ${l}s</label>`).join('')}</div>`
      + fieldSel('plFresh', 'New recipes to try', [0, 1, 2, 3, 4].map(n => [String(n), n === 0 ? 'None, just our favourites' : `${n} new`]), String(o.fresh))
      + (w.entries.length ? `<label class="cb"><input type="checkbox" id="plKeep"${o.keep ? ' checked' : ''}> Keep the ${w.entries.length} meal${w.entries.length > 1 ? 's' : ''} already planned</label>` : '')
      + `<label class="cb"><input type="checkbox" id="plBaby"${o.baby ? ' checked' : ''}> Suggest baby freezer prep</label>`
      + `<p class="note" style="text-align:left">Claude sees ${kc} kitchen item${kc === 1 ? '' : 's'}, ${favs} rotation favourite${favs === 1 ? '' : 's'} and the baby stash. It cooks low-salt for your toddler. This uses your Claude usage and takes about a minute.</p>`,
      'Make my plan'));
    return;
  }
  if (s.step === 'busy') {
    sh(`<div class="grab"></div><h2>Planning your week…</h2><div class="busy"><div class="spin"></div><span id="plStatus">${esc(s.status || 'Thinking…')}</span></div><div class="actions"><button type="button" class="ghostbtn" id="plStop">Stop</button></div>`);
    return;
  }
  if (s.step === 'error') {
    sh(`<div class="grab"></div><h2>Couldn’t make a plan</h2><div class="preview bad">${esc(s.err)}</div><div class="actions" style="margin-top:14px"><button type="button" class="primary" id="plAgain">Back</button><button type="button" class="ghostbtn" id="fCancel">Close</button></div>`);
    return;
  }
  const r = s.result;
  let h = `<div class="grab"></div><h2>Your plan</h2><div class="form">`;
  if (r.summary) h += `<div class="summary">${esc(r.summary)}</div>`;
  h += '<div>';
  DAYS.forEach((dn, di) => {
    const ms = r.meals.filter(m => m.day === di).sort((a, b) => 'bld'.indexOf(a.slot) - 'bld'.indexOf(b.slot));
    if (!ms.length) return;
    h += `<p class="pday">${dn}</p>` + ms.map(m => `<div class="pm"><span class="s">${slotName(m.slot)}</span><span class="n">${esc(m.name)}<span class="badge t-${m.tag}">${TAGNAME[m.tag]}</span>${m.isNew ? '<span class="badge t-both">New</span>' : ''}${m.note ? `<small>${esc(m.note)}</small>` : ''}</span></div>`).join('');
  });
  h += '</div>';
  if (r.babyPrep.length) h += `<div class="field"><span class="lbl">Baby freezer prep</span>` + r.babyPrep.map((b, i) => `<label class="cb"><input type="checkbox" data-bp="${i}" checked> <span>${esc(b.name)}${b.yield ? ` · ${esc(b.yield)}` : ''}${b.note ? `<span class="sub" style="display:block;font-size:.78rem;color:var(--muted)">${esc(b.note)}</span>` : ''}</span></label>`).join('') + '</div>';

  h += `<div class="actions"><button type="button" class="primary" id="plUse">Use this plan</button><button type="button" class="ghostbtn" id="plAgain">Change and retry</button></div></div>`;

Reply with only JSON in exactly this shape:
{"summary": "one or two sentences on the week's approach", "meals": [{"day": 0, "slot": "d", "name": "Meal name", "tag": "both", "ing": ["ingredient"], "note": "short tip", "isNew": false}], "babyPrep": [{"name": "Recipe name", "ing": ["ingredient"], "yield": "12 muffins", "note": "short method and freezing tip"}]}
day is 0 for Sunday, 1 for Monday, through 6 for Saturday. slot is "b" for breakfast, "l" for lunch, "d" for dinner.`;
}
const PLAN_ERR = {
  not_granted: 'Claude wasn’t allowed for this page. You can still plan by hand, or use Import to paste a plan from a Claude chat.',
  rate_limited: 'Claude is busy right now. Wait a minute and try again.',
  invalid_json: 'Claude’s answer didn’t come through in a form the app can read. Try again.',
  empty_completion: 'Claude didn’t return a plan. Try again.',
  prompt_too_large: 'There’s too much kitchen and meal data to send at once. Remove a few old saved meals or kitchen items and try again.',
};
async function runPlanner() {
  const s = sheet, o = s.opt;
  o.ideas = $('#plIdeas').value.trim();
  o.slots = [...document.querySelectorAll('[data-plslot]')].filter(c => c.checked).map(c => c.dataset.plslot);
  o.fresh = +$('#plFresh').value; o.keep = $('#plKeep') ? $('#plKeep').checked : true; o.baby = $('#plBaby').checked;
  if (!o.slots.length) { toast('Pick at least one meal to fill in'); return; }
  const w = week(); if (w.ideas !== o.ideas) { w.ideas = o.ideas; saveWeek(); }
  await loadDoc(weekDocKey(ymd(addDays(parseKey(S.view.week), -7)))).catch(() => {});
  if (sheet !== s) return;
  s.step = 'busy'; s.status = 'Thinking…'; s.ctl = new AbortController(); drawPlanner();
  try {
    const raw = await sampleFn.json(plannerPrompt(o), {
      signal: s.ctl.signal, modelTier: 'default',
      onText: () => { if (s.status !== 'Writing your plan…') { s.status = 'Writing your plan…'; const n = $('#plStatus'); if (n && sheet === s) n.textContent = s.status; } },
    });
    if (sheet !== s) return;
    const r = cleanPlan(raw, o);
    if (!r.meals.length) throw { code: 'empty_completion' };
    s.result = r; s.step = 'preview';
  } catch (e) {
    if (sheet !== s) return;
    if (e && e.code === 'cancelled') { s.step = 'form'; }
    else { s.step = 'error'; s.err = PLAN_ERR[e && e.code] || 'Couldn’t reach Claude right now. Try again in a little while.'; }
  }
  s.ctl = null; drawPlanner();
}
function cleanPlan(raw, o) {
  const strs = a => Array.isArray(a) ? a.map(x => String(x || '').trim()).filter(Boolean).slice(0, 30) : [];
  const meals = (Array.isArray(raw?.meals) ? raw.meals : []).map(m => ({
    day: Number.isInteger(+m.day) ? +m.day : -1, slot: String(m.slot || '').toLowerCase()[0],
    name: String(m.name || '').trim().slice(0, 120), tag: TAGNAME[m.tag] ? m.tag : 'both',
    ing: strs(m.ing), note: String(m.note || '').trim().slice(0, 240), isNew: !!m.isNew,
  })).filter(m => m.day >= 0 && m.day < 7 && 'bld'.includes(m.slot) && m.slot && m.name);
  const babyPrep = o.baby && Array.isArray(raw?.babyPrep) ? raw.babyPrep.slice(0, 3).map(b => ({
    name: String(b.name || '').trim().slice(0, 120), ing: strs(b.ing), yield: String(b.yield || '').trim().slice(0, 60), note: String(b.note || '').trim().slice(0, 400),
  })).filter(b => b.name) : [];
  return { summary: String(raw?.summary || '').trim().slice(0, 500), meals, babyPrep };
}
function applyPlan() {
  const s = sheet, r = s.result, o = s.opt, w = week();
  if (!o.keep) w.entries = w.entries.filter(e => !o.slots.includes(e.slot));
  r.meals.forEach(m => w.entries.push({ id: uidGen(), day: m.day, slot: m.slot, name: m.name, tag: m.tag, ing: m.ing, note: m.note }));
  if ($('#plSaveNew').checked) {
    let added = 0;
    r.meals.forEach(m => { if (!/^leftover/i.test(m.name) && !findLib(m.name)) { S.library.meals.push({ id: uidGen(), name: m.name, tag: m.tag, ing: [...m.ing] }); added++; } });
    if (added) saveLib();
  }
  let preps = 0;
  r.babyPrep.forEach((b, i) => {
    if (!document.querySelector(`[data-bp="${i}"]`)?.checked) return;
    let rec = S.baby.recipes.find(x => norm(x.name) === norm(b.name));
    if (!rec) { rec = { id: uidGen(), ...b }; S.baby.recipes.push(rec); }
    if (!w.prep.includes(rec.id)) { w.prep.push(rec.id); preps++; }
  });
  if (preps) saveBaby();
  saveWeek(); closeSheet(); S.view.tab = 'plan'; window.scrollTo(0, 0); render();
  toast(`Added ${r.meals.length} meals${preps ? ` and ${preps} baby prep` : ''}. Your grocery list is updated.`);
}

/* ---------- clicks ---------- */
let suppressClick = false;
document.addEventListener('click', ev => {
  if (suppressClick) { suppressClick = false; ev.preventDefault(); ev.stopPropagation(); return; }
  if (ev.target.closest('#sheetwrap')) return;
  const t = ev.target.closest('button, [data-drag]'); if (!t) return;
  if (t.dataset.add) { const [d, s] = t.dataset.add.split('-'); openSheet({ mode: 'add-entry', day: +d, slot: s }); return; }
  if (t.dataset.drag === 'entry') { openSheet({ mode: 'edit-entry', id: t.dataset.id }); return; }
  if (t.dataset.drag === 'lib') { toast('Hold the meal, then drag it onto a day'); return; }
  if (t.dataset.tab) { S.view.tab = t.dataset.tab; cacheLocal(); window.scrollTo(0, 0); render(); return; }
  if (t.dataset.f) { S.view.filter = t.dataset.f; cacheLocal(); render(); return; }
  if (t.id === 'prevWeek' || t.id === 'nextWeek' || t.id === 'thisWeek') {
    S.view.week = t.id === 'thisWeek' ? THIS_WEEK : ymd(addDays(parseKey(S.view.week), t.id === 'prevWeek' ? -7 : 7));
    window.scrollTo(0, 0); render(); loadDoc(weekDocKey(S.view.week)); return;
  }
  if (t.id === 'trayToggle') { S.view.trayOpen = !S.view.trayOpen; cacheLocal(); renderTray(); return; }
  if (t.id === 'newMeal') { openSheet({ mode: 'add-lib' }); return; }
  if (t.id === 'openImport') { openSheet({ mode: 'import' }); return; }
  if (t.id === 'openPlanner') { openSheet({ mode: 'planner' }); return; }
  if (t.id === 'editIdeas') { openSheet({ mode: 'ideas' }); return; }
  if (t.dataset.mf) { S.view.mfilter = t.dataset.mf; cacheLocal(); render(); return; }
  if (t.dataset.star) { const m = S.library.meals.find(x => x.id === t.dataset.star); m.fav = !m.fav; saveLib(); render(); toast(m.fav ? `${m.name} is in the rotation` : `${m.name} removed from the rotation`); return; }
  if (t.dataset.kf) { S.view.kfilter = t.dataset.kf; cacheLocal(); render(); return; }
  if (t.id === 'kitAdd') { addKitchen(); return; }
  if (t.id === 'kitBulk') { openSheet({ mode: 'kbulk' }); return; }
  if (t.dataset.kedit) { openSheet({ mode: 'kitem', id: t.dataset.kedit }); return; }
  if (t.dataset.kstat) { const i = S.kitchen.items.find(x => x.id === t.dataset.kstat); i.status = { have: 'low', low: 'out', out: 'have' }[i.status] || 'have'; saveKit(); render(); return; }
  if (t.id === 'addStash') { openSheet({ mode: 'stash' }); return; }
  if (t.dataset.stash) { openSheet({ mode: 'stash', id: t.dataset.stash }); return; }
  if (t.dataset.sdec || t.dataset.sinc) {
    const st = S.baby.stash.find(x => x.id === (t.dataset.sdec || t.dataset.sinc)); if (!st) return;
    st.portions += t.dataset.sinc ? 1 : -1;
    if (st.portions <= 0) { S.baby.stash = S.baby.stash.filter(x => x !== st); toast(`${st.name} is used up`); }
    saveBaby(); render(); return;
  }
  if (t.id === 'newBRecipe') { openSheet({ mode: 'brecipe' }); return; }
  if (t.dataset.brecipe) { openSheet({ mode: 'brecipe', id: t.dataset.brecipe }); return; }
  if (t.dataset.made) { openSheet({ mode: 'made', id: t.dataset.made }); return; }
  if (t.dataset.prepadd) { const w = week(); if (!w.prep.includes(t.dataset.prepadd)) w.prep.push(t.dataset.prepadd); saveWeek(); render(); toast('Added to this week. Ingredients are on the grocery list.'); return; }
  if (t.dataset.unprep) { const w = week(); w.prep = w.prep.filter(x => x !== t.dataset.unprep); delete w.prepDone[t.dataset.unprep]; saveWeek(); render(); return; }
  if (t.dataset.gopt) { openSheet({ mode: 'gitem', key: t.dataset.gopt }); return; }
  if (t.dataset.needit) { const w = week(); w.need[t.dataset.needit] = true; delete w.have[t.dataset.needit]; saveWeek(); render(); return; }
  if (t.id === 'openPC') { openSheet({ mode: 'pc' }); return; }
  if (t.id === 'putAway') { openSheet({ mode: 'putaway' }); return; }
  if (t.dataset.editlib) { openSheet({ mode: 'edit-lib', id: t.dataset.editlib }); return; }
  const w = week();
  if (t.dataset.check !== undefined) { const k = t.dataset.check; if (w.checked[k]) delete w.checked[k]; else w.checked[k] = true; saveWeek(); renderGroc(); return; }
  if (t.dataset.xcheck) { const x = w.extras.find(x => x.id === t.dataset.xcheck); x.done = !x.done; saveWeek(); renderGroc(); return; }
  if (t.dataset.xdel) { w.extras = w.extras.filter(x => x.id !== t.dataset.xdel); saveWeek(); renderGroc(); return; }
  if (t.id === 'addExtra') { addExtra(); return; }
  if (t.id === 'uncheckAll') { w.checked = {}; w.extras.forEach(x => x.done = false); saveWeek(); renderGroc(); return; }
  if (t.id === 'copyList') copyText(shoppingLines(false).join('\n'), 'List copied');
});
function addKitchen() {
  const inp = $('#kitInput'), v = inp.value.trim(), loc = $('#kitLoc').value; if (!v) return inp.focus();
  const ex = kitchenMatch(v);
  if (ex) { ex.status = 'have'; toast(`${ex.name} marked as Have`); }
  else { S.kitchen.items.push({ id: uidGen(), name: v, loc, status: 'have', qty: '', pc: '' }); toast(`Added to the ${loc}`); }
  kitQuery = ''; kitLocDefault = loc; saveKit(); renderKitchen(); renderHeader(); $('#kitInput').focus();
}
function addExtra() {
  const inp = $('#extraInput'), v = inp.value.trim(); if (!v) return;
  week().extras.push({ id: uidGen(), text: v, done: false }); saveWeek(); renderGroc(); $('#extraInput').focus();
}
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'extraInput') { ev.preventDefault(); addExtra(); }
  if (ev.key === 'Enter' && ev.target.id === 'kitInput') { ev.preventDefault(); addKitchen(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('[data-drag]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'kitInput') { kitQuery = ev.target.value; const pos = ev.target.selectionStart; renderKitchen(); const n = $('#kitInput'); n.focus(); n.setSelectionRange(pos, pos); }
  if (ev.target.id === 'mealSearch') { mealQuery = ev.target.value; const pos = ev.target.selectionStart; renderMeals(); const n = $('#mealSearch'); n.focus(); n.setSelectionRange(pos, pos); }
});

/* ---------- drag and drop (hold to pick up on touch) ---------- */
let pend = null, drag = null, raf = 0;
const HOLD_MS = 320, SLOP = 9;
function startPending(el, x, y, touch) {
  cancelPending();
  pend = { el, x, y, touch, timer: touch ? setTimeout(() => beginDrag(pend.x, pend.y), HOLD_MS) : 0 };
}
function cancelPending() { if (pend) { clearTimeout(pend.timer); pend = null; } }
function beginDrag(x, y) {
  if (!pend) return;
  const el = pend.el, r = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.classList.add('ghost'); ghost.style.width = r.width + 'px';
  document.body.appendChild(ghost);
  drag = { kind: el.dataset.drag, id: el.dataset.id, el, ghost, ox: x - r.left, oy: y - r.top, x, y, target: null, armed: el.dataset.drag === 'entry' };
  if (drag.kind === 'entry') { el.classList.add('dragging-src'); $('#trash').classList.add('show'); }
  pend = null;
  try { navigator.vibrate?.(12); } catch {}
  moveDrag(x, y);
  raf = requestAnimationFrame(autoScroll);
}
function moveDrag(x, y) {
  drag.x = x; drag.y = y;
  drag.ghost.style.transform = `translate(${x - drag.ox}px, ${y - drag.oy}px) scale(1.05) rotate(-2deg)`;
  hitTest();
}
function clearMarks() {
  document.querySelectorAll('.slot.over').forEach(n => n.classList.remove('over'));
  document.querySelectorAll('.insert-before').forEach(n => n.classList.remove('insert-before'));
  $('#trash').classList.remove('over');
}
function hitTest() {
  clearMarks();
  const n = document.elementFromPoint(drag.x, drag.y);
  drag.target = null;
  if (!n) return;
  if (n.closest('#trash') && drag.kind === 'entry') { $('#trash').classList.add('over'); drag.target = { trash: true }; return; }
  if (n.closest('#tray, .tabs')) return;
  const slot = n.closest('.slot'); if (!slot) return;
  slot.classList.add('over');
  const chip = n.closest('.chip[data-drag="entry"]');
  const before = chip && chip.dataset.id !== drag.id ? chip.dataset.id : null;
  if (before) chip.classList.add('insert-before');
  drag.target = { day: +slot.dataset.day, slot: slot.dataset.slot, before };
}
function autoScroll() {
  if (!drag) return;
  const tray = $('#tray'), bottomEdge = !tray.hidden ? tray.getBoundingClientRect().top : $('.tabs').getBoundingClientRect().top;
  const topEdge = $('.top').getBoundingClientRect().bottom;
  if (drag.y < bottomEdge - 110) drag.armed = true;
  let dy = 0;
  if (drag.y < topEdge + 70 && drag.y > 0) dy = -Math.max(4, (topEdge + 70 - drag.y) / 5);
  else if (drag.armed && drag.y > bottomEdge - 70 && drag.y < bottomEdge) dy = Math.max(4, (drag.y - (bottomEdge - 70)) / 5);
  if (dy) { window.scrollBy(0, dy); hitTest(); }
  raf = requestAnimationFrame(autoScroll);
}
function endDrag(drop) {
  cancelAnimationFrame(raf);
  const d = drag; drag = null;
  clearMarks();
  d.ghost.remove(); d.el.classList.remove('dragging-src'); $('#trash').classList.remove('show');
  suppressClick = true; setTimeout(() => suppressClick = false, 400);
  if (!drop || !d.target) return;
  const w = week();
  if (d.target.trash) { w.entries = w.entries.filter(e => e.id !== d.id); saveWeek(); render(); toast('Meal removed'); return; }
  let entry;
  if (d.kind === 'entry') {
    entry = w.entries.find(e => e.id === d.id); if (!entry) return;
    if (entry.day === d.target.day && entry.slot === d.target.slot && !d.target.before) return;
    w.entries = w.entries.filter(e => e !== entry);
  } else {
    const m = S.library.meals.find(x => x.id === d.id); if (!m) return;
    entry = { id: uidGen(), name: m.name, tag: m.tag, ing: [...m.ing], note: '' };
  }
  entry.day = d.target.day; entry.slot = d.target.slot;
  const idx = d.target.before ? w.entries.findIndex(e => e.id === d.target.before) : -1;
  if (idx >= 0) w.entries.splice(idx, 0, entry); else w.entries.push(entry);
  saveWeek(); render();
  if (d.kind === 'lib') toast(`Added to ${DAYS[entry.day]} ${SLOTS.find(s => s[0] === entry.slot)[1].toLowerCase()}`);
}
// touch
document.addEventListener('touchstart', ev => {
  if (ev.touches.length > 1) { cancelPending(); return; }
  const el = ev.target.closest('[data-drag]'); if (!el || ev.target.closest('#sheetwrap')) return;
  const t = ev.touches[0]; startPending(el, t.clientX, t.clientY, true);
}, { passive: true });
document.addEventListener('touchmove', ev => {
  const t = ev.touches[0];
  if (drag) { ev.preventDefault(); moveDrag(t.clientX, t.clientY); return; }
  if (pend && Math.hypot(t.clientX - pend.x, t.clientY - pend.y) > SLOP) cancelPending();
}, { passive: false });
document.addEventListener('touchend', ev => { if (drag) { ev.preventDefault(); endDrag(true); } else cancelPending(); }, { passive: false });
document.addEventListener('touchcancel', () => { if (drag) endDrag(false); else cancelPending(); });
document.addEventListener('contextmenu', ev => { if (ev.target.closest('[data-drag]')) ev.preventDefault(); });
// mouse (for testing on a computer)
document.addEventListener('mousedown', ev => {
  if (ev.button !== 0) return;
  const el = ev.target.closest('[data-drag]'); if (!el || ev.target.closest('#sheetwrap')) return;
  startPending(el, ev.clientX, ev.clientY, false);
});
document.addEventListener('mousemove', ev => {
  if (drag) { moveDrag(ev.clientX, ev.clientY); return; }
  if (pend && !pend.touch && Math.hypot(ev.clientX - pend.x, ev.clientY - pend.y) > 5) beginDrag(ev.clientX, ev.clientY);
});
document.addEventListener('mouseup', () => { if (drag) endDrag(true); else cancelPending(); });

render();
})();
</script>
